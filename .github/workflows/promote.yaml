---
name: mlops-promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Model version to promote (e.g. 3). If empty, latest Staging is promoted."
        required: false
      actor:
        description: "Actor initiating the promotion (audit)"
        required: true
      reason:
        description: "Reason for promotion (audit)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r training/requirements.txt
      - name: Port-forward MLflow
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          nohup kubectl -n mlops-system port-forward svc/mlflow 5000:5000 > /tmp/pf.log 2>&1 &
          sleep 5
      - name: Run promote.py
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
          MODEL_NAME: iris-classifier
          IN_ACTOR: ${{ inputs.actor }}
          IN_REASON: ${{ inputs.reason }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          cd training
          if [ -n "$IN_VERSION" ]; then
            python promote.py --actor "$IN_ACTOR" --reason "$IN_REASON" --version "$IN_VERSION"
          else
            python promote.py --actor "$IN_ACTOR" --reason "$IN_REASON"
          fi
