---
name: mlops-ci

on:
  push:
    branches: [final, main]
  pull_request:
    branches: [final, main]
  workflow_dispatch:
    inputs:
      run_train:
        description: "Trigger training job in cluster"
        required: false
        default: "false"

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bbeellkk-ua
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # -----------------------------------------------------------------
  # Static analysis
  # -----------------------------------------------------------------
  lint:
    name: lint (ruff + yamllint + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install ruff==0.6.9 yamllint==1.35.1
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: yamllint
        run: yamllint -c .yamllint.yaml .

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------
  # Unit tests
  # -----------------------------------------------------------------
  test-training:
    name: test (training)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r training/requirements.txt
      - name: pytest
        run: cd training && python -m pytest -q

  test-inference:
    name: test (inference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r inference/requirements.txt
          # tests boot a real MLflow file-store, need training deps too
          pip install -r training/requirements.txt
      - name: pytest
        run: cd inference && PYTHONPATH=. python -m pytest -q

  # -----------------------------------------------------------------
  # Docker images
  # -----------------------------------------------------------------
  build:
    name: build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: [lint, test-training, test-inference]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        component: [training, inference, evidently]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_OWNER}/goit-mlops-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.short_sha }}
            ${{ steps.tag.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=goit-mlops-${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.short_sha }}
          format: table
          exit-code: "0"       # informational for the assignment; flip to 1 in real prod
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
