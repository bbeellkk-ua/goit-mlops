apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  destination:
    namespace: application
    server: https://kubernetes.default.svc
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 13.7.2
    helm:
      releaseName: minio
      valuesObject:
        # Bitnami перенесли старі образи в реєстр bitnamilegacy.
        # Задаємо це глобально + явно для minio image.
        global:
          imageRegistry: docker.io
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/minio
        clientImage:
          registry: docker.io
          repository: bitnamilegacy/minio-client
        auth:
          rootUser: minio
          rootPassword: minio123
        defaultBuckets: "mlflow-artifacts"
        service:
          type: ClusterIP
        persistence:
          enabled: false
        # Розміщуємо на infra-нодах (taint node=infra:NoSchedule)
        nodeSelector:
          node: infra
        tolerations:
          - key: node
            operator: Equal
            value: infra
            effect: NoSchedule
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
