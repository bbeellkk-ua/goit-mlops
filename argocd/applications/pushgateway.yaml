apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
  namespace: argocd
spec:
  project: default
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: 2.15.0
    helm:
      releaseName: pushgateway
      valuesObject:
        service:
          type: ClusterIP
          port: 9091

        # Prometheus (kube-prometheus-stack) підбирає ServiceMonitor
        # за міткою release: kube-prometheus-stack
        serviceMonitor:
          enabled: true
          namespace: monitoring
          additionalLabels:
            release: kube-prometheus-stack
          # scrape частіше, щоб швидко бачити нові push-и під час експериментів
          interval: 15s
          scrapeTimeout: 10s

        # Persistent storage не потрібен — метрики короткоживучі,
        # використовуються лише під час експериментів.
        persistentVolume:
          enabled: false

        # Розміщуємо на infra-нодах (taint node=infra:NoSchedule)
        nodeSelector:
          node: infra
        tolerations:
          - key: node
            operator: Equal
            value: infra
            effect: NoSchedule
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
