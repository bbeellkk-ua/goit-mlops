apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-postgres
  namespace: argocd
spec:
  project: default
  destination:
    namespace: application
    server: https://kubernetes.default.svc
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 12.5.6
    helm:
      releaseName: mlflow-postgres
      valuesObject:
        # Bitnami перенесли старі образи в реєстр bitnamilegacy.
        global:
          imageRegistry: docker.io
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
        volumePermissions:
          image:
            registry: docker.io
            repository: bitnamilegacy/os-shell
        metrics:
          image:
            registry: docker.io
            repository: bitnamilegacy/postgres-exporter
        auth:
          username: mlflow
          password: mlflowpass
          database: mlflow
        primary:
          persistence:
            enabled: false
          # Розміщуємо на infra-нодах (taint node=infra:NoSchedule)
          nodeSelector:
            node: infra
          tolerations:
            - key: node
              operator: Equal
              value: infra
              effect: NoSchedule
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
