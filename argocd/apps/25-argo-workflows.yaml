---
# Argo Workflows — контролер для пайплайнів тренування.
# Встановлюється як Helm-реліз через ArgoCD у namespace `argo`.
#
# Чому окрема Application (не app-of-apps через 20-mlops-system): бо Helm-джерело,
# а не kubectl-манифести — простіше тримати як самостійний ArgoCD Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-argo-workflows
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 0.42.3
    helm:
      releaseName: argo-workflows
      valueFiles: []
      values: |
        executor:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        controller:
          workflowNamespaces:
            - mlops-system
          metricsConfig:
            enabled: true
          # RBAC — controller управляє workflows у mlops-system.
          workflowRestrictions:
            templateReferencing: Strict
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          nodeSelector:
            node: infra
          tolerations:
            - key: node
              operator: Equal
              value: infra
              effect: NoSchedule
          workflowDefaults:
            spec:
              nodeSelector:
                node: infra
              tolerations:
                - key: node
                  operator: Equal
                  value: infra
                  effect: NoSchedule
        server:
          enabled: true
          serviceType: ClusterIP
          authModes:
            - server
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-dns01
            hosts:
              - argo.squirell.pp.ua
            paths:
              - /
            pathType: Prefix
            tls:
              - secretName: argo-workflows-server-tls
                hosts:
                  - argo.squirell.pp.ua
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          nodeSelector:
            node: infra
          tolerations:
            - key: node
              operator: Equal
              value: infra
              effect: NoSchedule
        # Використовуємо MinIO як artifact repository (той самий, що і в MLflow).
        artifactRepository:
          archiveLogs: true
          s3:
            endpoint: minio.mlops-system.svc.cluster.local:9000
            bucket: argo-workflows
            insecure: true
            accessKeySecret:
              name: argo-workflows-s3
              key: access_key_id
            secretKeySecret:
              name: argo-workflows-s3
              key: secret_access_key
        # Використовуємо CRD-based sink на Prometheus (kube-prometheus-stack підхопить).
        useDefaultArtifactRepo: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
