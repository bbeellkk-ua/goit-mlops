---
# Default deny for the mlops-system namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: mlops-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Egress: allow DNS + intra-namespace + internet HTTPS (MLflow uses PyPI on cold start of training jobs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-and-cluster
  namespace: mlops-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-production
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Ingress into mlops-system: allow ingress-nginx (MLflow UI), Prometheus scraping, and workloads from mlops-staging/production/monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-scrape-and-clients
  namespace: mlops-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-production
        - podSelector: {}
