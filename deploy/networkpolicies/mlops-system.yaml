---
# Default deny for the mlops-system namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: mlops-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Egress: allow DNS + intra-namespace + kube-apiserver + інші робочі NS.
# Argo Workflows executor POSTить workflowtaskresults у kube-apiserver
# (443), тому потрібен egress до нього. IP апі-сервера не належить жодному
# namespace, тож `namespaceSelector` для нього не працює — використовуємо
# порожній `to:` для дозволу егресу на 443 у весь кластер (обмежений
# `podSelector: {}` для policy scope).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-and-cluster
  namespace: mlops-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-production
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # kube-apiserver: IP не в namespace, тому дозволяємо TCP/443 всюди.
    - ports:
        - protocol: TCP
          port: 443
    # HTTPS назовні для MLflow/pip/ghcr під час cold start training jobs.
    - ports:
        - protocol: TCP
          port: 6443
---
# Ingress into mlops-system: allow ingress-nginx (MLflow UI), Prometheus scraping, and workloads from mlops-staging/production/monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-scrape-and-clients
  namespace: mlops-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlops-production
        - podSelector: {}
