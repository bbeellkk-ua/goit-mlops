# ServiceAccounts для двох людських ролей (Блок C3):
#   mlops-engineer — повний доступ до staging, обмежений до production
#   mlops-viewer   — read-only на всі три namespace
#
# У локальному k3s кластері немає SSO; для перевірки можна створити
# kubeconfig на базі token цих SA:
#   kubectl -n mlops-system create token mlops-engineer --duration=8h
#
# І workload-SA для inference:
#   inference-sa — використовується Deployment inference; має право лише
#     читати ConfigMap/Secret у своєму namespace (мінімально необхідне).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-engineer
  namespace: mlops-system
  labels: {role: mlops-engineer, part-of: goit-mlops}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-viewer
  namespace: mlops-system
  labels: {role: mlops-viewer, part-of: goit-mlops}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-sa
  namespace: mlops-staging
  labels: {app: inference, part-of: goit-mlops}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-sa
  namespace: mlops-production
  labels: {app: inference, part-of: goit-mlops}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-sa
  namespace: mlops-system
  labels: {app: training, part-of: goit-mlops}
