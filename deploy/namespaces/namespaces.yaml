# Namespaces для фінального проєкту — Блок A2.
#
# mlops-system     — MLflow, MinIO, Postgres, PushGateway.
# mlops-staging    — inference (staging), тягне модель зі стадії Staging.
# mlops-production — inference (production), Blue-Green, тягне Production.
#
# Namespace monitoring — існуючий у кластері (kube-prometheus-stack + Loki).
# Ми в нього НЕ втручаємось; дашборди/rules доставляємо через ConfigMap-и
# з правильними labels (див. deploy/monitoring/).
---
apiVersion: v1
kind: Namespace
metadata:
  name: mlops-system
  labels:
    app.kubernetes.io/part-of: goit-mlops
    tier: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: mlops-staging
  labels:
    app.kubernetes.io/part-of: goit-mlops
    tier: workload
    environment: staging
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: mlops-production
  labels:
    app.kubernetes.io/part-of: goit-mlops
    tier: workload
    environment: production
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# ResourceQuota: обмежуємо, скільки може з'їсти workload у кластері -
# захист від runaway HPA і випадкових OOM (Блок A2 / "engineering hygiene").
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mlops-staging-quota
  namespace: mlops-staging
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mlops-production-quota
  namespace: mlops-production
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mlops-system-quota
  namespace: mlops-system
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
