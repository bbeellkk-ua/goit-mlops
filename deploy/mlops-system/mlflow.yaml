---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 1.6.2
    helm:
      releaseName: mlflow
      values: |
        service:
          type: ClusterIP
          port: 5000
        auth:
          enabled: false
        # Chart's own bundled Bitnami postgres is off; ми маємо власний mlflow-postgres Application.
        postgresql:
          enabled: false
        # Правильна схема chart 1.6.x: backendStore.postgres.*
        backendStore:
          postgres:
            enabled: true
            host: mlflow-postgres-postgresql.mlops-system.svc.cluster.local
            port: 5432
            database: mlflow
            user: mlflow
            password: mlflowpass
        # S3 artifact root (MinIO). Регіон передаємо через extraEnvVars, схема
        # chart НЕ приймає поле `defaultRegion` під artifactRoot.s3.
        artifactRoot:
          s3:
            enabled: true
            bucket: mlflow-artifacts
            awsAccessKeyId: minio
            awsSecretAccessKey: minio123
        extraEnvVars:
          AWS_ACCESS_KEY_ID: "minio"
          AWS_SECRET_ACCESS_KEY: "minio123"
          AWS_DEFAULT_REGION: "us-east-1"
          MLFLOW_S3_ENDPOINT_URL: "http://minio.mlops-system.svc.cluster.local:9000"
        # Ingress публікує MLflow за Cloudflare Zero Trust Application
        # (email/SSO). TLS — cert-manager + DNS-01 ClusterIssuer.
        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-dns01
            nginx.ingress.kubernetes.io/proxy-body-size: "50m"
          hosts:
            - host: mlflow.squirell.pp.ua
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: mlflow-tls
              hosts:
                - mlflow.squirell.pp.ua
        # ResourceQuota у mlops-system вимагає requests+limits для всіх подів.
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        nodeSelector:
          node: infra
        tolerations:
          - key: node
            operator: Equal
            value: infra
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
