---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 13.7.2
    helm:
      releaseName: minio
      values: |
        global:
          imageRegistry: docker.io
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/minio
        clientImage:
          registry: docker.io
          repository: bitnamilegacy/minio-client
        auth:
          rootUser: minio
          rootPassword: minio123
        # Comma-separated. `argo-workflows` bucket використовується Argo
        # executor-ом для archiveLogs та artefact passing між кроками DAG.
        defaultBuckets: "mlflow-artifacts,argo-workflows"
        service:
          type: ClusterIP
        persistence:
          enabled: false
        # ResourceQuota у mlops-system вимагає requests+limits для всіх подів.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        nodeSelector:
          node: infra
        tolerations:
          - key: node
            operator: Equal
            value: infra
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
