---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: 2.15.0
    helm:
      releaseName: pushgateway
      values: |
        service:
          type: ClusterIP
          port: 9091
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
        # pushgateway живе у namespace `monitoring`, який має власний ResourceQuota;
        # тримаємо requests/limits маленькими — pushgateway майже нічого не їсть.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        nodeSelector:
          node: infra
        tolerations:
          - key: node
            operator: Equal
            value: infra
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
